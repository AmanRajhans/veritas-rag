[project]
name = "veritas-rag"
version = "0.1.0"
description = "Evaluation-first hybrid RAG with grounded answers, calibrated abstention, and production observability."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aman Rajhans" }]
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "numpy>=1.26,<3.0",
  "pydantic>=2.9,<3.0",
  "scikit-learn>=1.5,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.2,<6.0"]

[dependency-groups]
dev = [
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<10.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.8,<1.0",
]

[project.scripts]
veritas-rag = "veritas_rag.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veritas_rag"]

[tool.pytest.ini_options]
addopts = "-q --cov=veritas_rag --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["veritas_rag"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
